<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gem Generator</title>
<style>
  :root {
    --bg: #1a1a2e;
    --surface: #16213e;
    --panel: #0f3460;
    --accent: #e94560;
    --accent2: #533483;
    --text: #eaeaea;
    --text-muted: #8888aa;
    --border: #2a2a4a;
    --input-bg: #0d1b2a;
    --gem-color: #4fc3f7;
    --shadow: rgba(0,0,0,0.4);
    --btn-bg: #e94560;
    --btn-text: #fff;
    --range-track: #2a2a4a;
    --range-thumb: #e94560;
  }
  [data-theme="light"] {
    --bg: #f0f4f8;
    --surface: #ffffff;
    --panel: #e8eef4;
    --accent: #d63031;
    --accent2: #6c5ce7;
    --text: #2d3436;
    --text-muted: #636e72;
    --border: #dfe6e9;
    --input-bg: #f8fafc;
    --gem-color: #0984e3;
    --shadow: rgba(0,0,0,0.1);
    --btn-bg: #d63031;
    --btn-text: #fff;
    --range-track: #dfe6e9;
    --range-thumb: #d63031;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 12px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 2px 8px var(--shadow);
    z-index: 10;
  }

  header h1 {
    font-size: 1.3rem;
    font-weight: 700;
    letter-spacing: 0.5px;
  }

  header h1 span { color: var(--accent); }

  .header-actions { display: flex; gap: 10px; align-items: center; }

  .btn-icon {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 6px 12px;
    cursor: pointer;
    font-size: 0.85rem;
    transition: background 0.2s;
  }
  .btn-icon:hover { background: var(--accent2); color: #fff; }

  .main {
    display: grid;
    grid-template-columns: 320px 1fr;
    flex: 1;
    overflow: hidden;
    height: calc(100vh - 53px);
  }

  .controls {
    background: var(--surface);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .controls::-webkit-scrollbar { width: 6px; }
  .controls::-webkit-scrollbar-track { background: transparent; }
  .controls::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .section-label {
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--accent);
    margin-top: 10px;
    margin-bottom: 4px;
  }

  .control-row {
    display: flex;
    flex-direction: column;
    gap: 4px;
    padding: 8px 10px;
    background: var(--panel);
    border-radius: 8px;
    border: 1px solid var(--border);
  }

  .control-row label {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.82rem;
    color: var(--text-muted);
  }

  .control-row label strong {
    color: var(--text);
    font-size: 0.88rem;
    font-weight: 600;
  }

  .control-row label .val {
    font-family: 'Courier New', monospace;
    font-size: 0.82rem;
    color: var(--accent);
    min-width: 45px;
    text-align: right;
  }

  input[type="range"] {
    width: 100%;
    height: 4px;
    -webkit-appearance: none;
    appearance: none;
    background: var(--range-track);
    border-radius: 2px;
    outline: none;
    cursor: pointer;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--range-thumb);
    cursor: pointer;
    box-shadow: 0 0 4px var(--shadow);
  }
  input[type="range"]::-moz-range-thumb {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--range-thumb);
    cursor: pointer;
    border: none;
  }

  select, input[type="number"] {
    width: 100%;
    background: var(--input-bg);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 0.88rem;
    outline: none;
    cursor: pointer;
  }
  select:focus, input[type="number"]:focus {
    border-color: var(--accent);
  }

  input[type="number"] { text-align: right; }

  .btn-download {
    margin-top: 12px;
    padding: 12px;
    background: var(--btn-bg);
    color: var(--btn-text);
    border: none;
    border-radius: 10px;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: 0.5px;
    transition: opacity 0.2s, transform 0.1s;
    text-align: center;
  }
  .btn-download:hover { opacity: 0.88; }
  .btn-download:active { transform: scale(0.98); }

  .dimensions {
    margin-top: 8px;
    padding: 10px;
    background: var(--panel);
    border-radius: 8px;
    border: 1px solid var(--border);
    font-size: 0.8rem;
    color: var(--text-muted);
    line-height: 1.7;
  }
  .dimensions span { color: var(--accent); font-family: monospace; }

  .preview {
    position: relative;
    background: var(--bg);
    overflow: hidden;
  }

  #canvas-container {
    width: 100%;
    height: 100%;
  }

  #canvas-container canvas {
    display: block;
    width: 100% !important;
    height: 100% !important;
  }

  .preview-overlay {
    position: absolute;
    bottom: 16px;
    right: 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    align-items: flex-end;
  }

  .preview-hint {
    position: absolute;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.45);
    color: #fff;
    font-size: 0.75rem;
    padding: 5px 12px;
    border-radius: 20px;
    pointer-events: none;
    opacity: 0.7;
    white-space: nowrap;
  }

  @media (max-width: 700px) {
    .main {
      grid-template-columns: 1fr;
      grid-template-rows: auto 1fr;
      height: auto;
      overflow: visible;
    }
    .controls {
      border-right: none;
      border-bottom: 1px solid var(--border);
      max-height: 55vh;
    }
    .preview {
      height: 55vw;
      min-height: 280px;
    }
  }
</style>
</head>
<body>

<header>
  <h1>&#9672; Gem <span>Generator</span></h1>
  <div class="header-actions">
    <button class="btn-icon" id="btn-wireframe">Wireframe: OFF</button>
    <button class="btn-icon" id="btn-theme">Light Mode</button>
  </div>
</header>

<div class="main">
  <div class="controls" id="controls">

    <div class="section-label">Cut Style</div>
    <div class="control-row">
      <label><strong>Cut</strong></label>
      <select id="cut">
        <option value="brilliant">Brilliant (Round)</option>
        <option value="emerald">Emerald (Rectangle)</option>
        <option value="marquise">Marquise (Pointed Oval)</option>
        <option value="oval">Oval</option>
        <option value="pear">Pear (Teardrop)</option>
        <option value="cushion">Cushion (Rounded Square)</option>
        <option value="princess">Princess (Square)</option>
      </select>
    </div>

    <div class="section-label">Dimensions</div>
    <div class="control-row">
      <label><strong>Diameter / Width</strong><span class="val" id="v-diameter">20 mm</span></label>
      <input type="range" id="diameter" min="5" max="60" step="1" value="20">
    </div>
    <div class="control-row">
      <label><strong>Total Depth %</strong><span class="val" id="v-depth">60%</span></label>
      <input type="range" id="depth" min="20" max="90" step="1" value="60">
    </div>

    <div class="section-label">Crown</div>
    <div class="control-row">
      <label><strong>Table Size %</strong><span class="val" id="v-table">55%</span></label>
      <input type="range" id="table" min="20" max="80" step="1" value="55">
    </div>
    <div class="control-row">
      <label><strong>Crown Height %</strong><span class="val" id="v-crownH">35%</span></label>
      <input type="range" id="crownH" min="5" max="60" step="1" value="35">
    </div>
    <div class="control-row">
      <label><strong>Crown Facets</strong><span class="val" id="v-crownFacets">8</span></label>
      <input type="range" id="crownFacets" min="4" max="16" step="1" value="8">
    </div>

    <div class="section-label">Pavilion</div>
    <div class="control-row">
      <label><strong>Pavilion Depth %</strong><span class="val" id="v-pavDepth">43%</span></label>
      <input type="range" id="pavDepth" min="20" max="70" step="1" value="43">
    </div>
    <div class="control-row">
      <label><strong>Pavilion Facets</strong><span class="val" id="v-pavFacets">8</span></label>
      <input type="range" id="pavFacets" min="4" max="16" step="1" value="8">
    </div>

    <div class="section-label">Girdle &amp; Culet</div>
    <div class="control-row">
      <label><strong>Girdle Thickness</strong><span class="val" id="v-girdle">3%</span></label>
      <input type="range" id="girdle" min="1" max="15" step="1" value="3">
    </div>
    <div class="control-row">
      <label><strong>Culet</strong></label>
      <select id="culet">
        <option value="none">None (Sharp Point)</option>
        <option value="small">Small</option>
        <option value="medium">Medium</option>
        <option value="large">Large</option>
      </select>
    </div>

    <button class="btn-download" id="btn-download">&#8659; Download STL</button>

    <div class="dimensions" id="dimensions">
      Loading&hellip;
    </div>

  </div>

  <div class="preview">
    <div id="canvas-container"></div>
    <div class="preview-hint">Drag to rotate &nbsp;&#8226;&nbsp; Scroll to zoom</div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://esm.sh/three@0.160.0",
    "three/addons/": "https://esm.sh/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { STLExporter } from 'three/addons/exporters/STLExporter.js';

// ─── Scene setup ────────────────────────────────────────────────────────────
const container = document.getElementById('canvas-container');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 1000);
camera.position.set(0, 15, 40);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 5;
controls.maxDistance = 200;

// Lights
const ambient = new THREE.AmbientLight(0xffffff, 0.5);
scene.add(ambient);

const dirLight1 = new THREE.DirectionalLight(0xffffff, 1.2);
dirLight1.position.set(30, 40, 20);
dirLight1.castShadow = true;
scene.add(dirLight1);

const dirLight2 = new THREE.DirectionalLight(0x88ccff, 0.6);
dirLight2.position.set(-20, -10, -20);
scene.add(dirLight2);

const pointLight = new THREE.PointLight(0xff8844, 0.8, 200);
pointLight.position.set(0, -20, 10);
scene.add(pointLight);

// Grid
const gridHelper = new THREE.GridHelper(100, 20, 0x333355, 0x222244);
scene.add(gridHelper);

// Gem mesh placeholder
let gemMesh = null;
let wireframeMesh = null;
let showWireframe = false;
let firstBuild = true;
const exporter = new STLExporter();

// ─── Geometry builders ───────────────────────────────────────────────────────

function ringPoints(n, rx, ry, shapeFn) {
  // Returns array of [x,y] for n points around a shape
  // shapeFn(t) -> [x,y] where t in [0,1)
  const pts = [];
  for (let i = 0; i < n; i++) {
    const t = i / n;
    pts.push(shapeFn(t, rx, ry));
  }
  return pts;
}

function circleShape(t, rx, ry) {
  const a = t * Math.PI * 2;
  return [Math.cos(a) * rx, Math.sin(a) * ry];
}

function ellipseShape(t, rx, ry) {
  const a = t * Math.PI * 2;
  return [Math.cos(a) * rx, Math.sin(a) * ry];
}

function marquiseShape(t, rx, ry) {
  // Pointed at top and bottom (t=0 and t=0.5)
  const a = t * Math.PI * 2;
  const squeeze = Math.pow(Math.abs(Math.sin(a)), 0.5);
  return [Math.cos(a) * rx * squeeze, Math.sin(a) * ry];
}

function pearShape(t, rx, ry) {
  // Pointed at bottom (t=0.75), round at top
  const a = t * Math.PI * 2 - Math.PI / 2;
  const squeeze = 0.5 + 0.5 * Math.pow(Math.max(0, Math.sin(a + Math.PI / 2)), 0.5);
  return [Math.cos(a) * rx * squeeze, Math.sin(a) * ry];
}

function squareShape(t, rx, ry) {
  // Square with sharp corners
  const a = t * Math.PI * 2;
  const cos = Math.cos(a), sin = Math.sin(a);
  const scale = Math.max(Math.abs(cos), Math.abs(sin));
  return [cos / scale * rx, sin / scale * ry];
}

function cushionShape(t, rx, ry) {
  // Square with rounded corners - superellipse approximation
  const a = t * Math.PI * 2;
  const cos = Math.cos(a), sin = Math.sin(a);
  const n = 4; // exponent: 4 = cushion-ish
  const scale = Math.pow(Math.pow(Math.abs(cos), n) + Math.pow(Math.abs(sin), n), 1 / n);
  return [cos / scale * rx, sin / scale * ry];
}

function emeraldShape(t, rx, ry) {
  // Rectangle with cut corners (octagonal)
  const a = t * Math.PI * 2;
  const cos = Math.cos(a), sin = Math.sin(a);
  const scale = Math.max(Math.abs(cos), Math.abs(sin));
  // Blend between circle and square to get cut corners
  const blend = 0.85;
  return [cos * (blend / scale + (1 - blend)) * rx, sin * (blend / scale + (1 - blend)) * ry];
}

function getShapeFn(cut) {
  switch (cut) {
    case 'emerald':   return emeraldShape;
    case 'marquise':  return marquiseShape;
    case 'oval':      return ellipseShape;
    case 'pear':      return pearShape;
    case 'princess':  return squareShape;
    case 'cushion':   return cushionShape;
    default:          return circleShape; // brilliant
  }
}

// Build flat polygon cap (table top or culet flat)
function buildCap(pts, y, facingUp) {
  const tris = [];
  const cx = pts.reduce((s, p) => s + p[0], 0) / pts.length;
  const cy = pts.reduce((s, p) => s + p[1], 0) / pts.length;
  for (let i = 0; i < pts.length; i++) {
    const j = (i + 1) % pts.length;
    if (facingUp) {
      tris.push([cx, y, cy], [pts[j][0], y, pts[j][1]], [pts[i][0], y, pts[i][1]]);
    } else {
      tris.push([cx, y, cy], [pts[i][0], y, pts[i][1]], [pts[j][0], y, pts[j][1]]);
    }
  }
  return tris;
}

// Build belt of triangles between two rings (each ring is array of [x,y] at given y heights)
function buildBelt(ringA, yA, ringB, yB) {
  const tris = [];
  const nA = ringA.length;
  const nB = ringB.length;

  if (nA === nB) {
    // Same count: two triangles per pair
    for (let i = 0; i < nA; i++) {
      const j = (i + 1) % nA;
      const a0 = [ringA[i][0], yA, ringA[i][1]];
      const a1 = [ringA[j][0], yA, ringA[j][1]];
      const b0 = [ringB[i][0], yB, ringB[i][1]];
      const b1 = [ringB[j][0], yB, ringB[j][1]];
      tris.push(a0, b0, a1);
      tris.push(b0, b1, a1);
    }
  } else if (nB === 2 * nA) {
    // Double resolution ring B
    for (let i = 0; i < nA; i++) {
      const j = (i + 1) % nA;
      const a0 = [ringA[i][0], yA, ringA[i][1]];
      const a1 = [ringA[j][0], yA, ringA[j][1]];
      const b0 = [ringB[2 * i][0], yB, ringB[2 * i][1]];
      const bm = [ringB[2 * i + 1][0], yB, ringB[2 * i + 1][1]];
      const b1 = [ringB[(2 * i + 2) % nB][0], yB, ringB[(2 * i + 2) % nB][1]];
      tris.push(a0, b0, bm);
      tris.push(a0, bm, a1);
      tris.push(a1, bm, b1);
    }
  } else if (nA === 2 * nB) {
    // Double resolution ring A
    for (let i = 0; i < nB; i++) {
      const j = (i + 1) % nB;
      const a0 = [ringA[2 * i][0], yA, ringA[2 * i][1]];
      const am = [ringA[2 * i + 1][0], yA, ringA[2 * i + 1][1]];
      const a1 = [ringA[(2 * i + 2) % nA][0], yA, ringA[(2 * i + 2) % nA][1]];
      const b0 = [ringB[i][0], yB, ringB[i][1]];
      const b1 = [ringB[j][0], yB, ringB[j][1]];
      tris.push(a0, b0, am);
      tris.push(am, b0, b1);
      tris.push(am, b1, a1);
    }
  } else {
    // Generic: use minimum shared count
    const n = Math.min(nA, nB);
    for (let i = 0; i < n; i++) {
      const j = (i + 1) % n;
      const ai = Math.round(i * nA / n) % nA;
      const aj = Math.round(j * nA / n) % nA;
      const bi = Math.round(i * nB / n) % nB;
      const bj = Math.round(j * nB / n) % nB;
      tris.push(
        [ringA[ai][0], yA, ringA[ai][1]],
        [ringB[bi][0], yB, ringB[bi][1]],
        [ringA[aj][0], yA, ringA[aj][1]]
      );
      tris.push(
        [ringB[bi][0], yB, ringB[bi][1]],
        [ringB[bj][0], yB, ringB[bj][1]],
        [ringA[aj][0], yA, ringA[aj][1]]
      );
    }
  }
  return tris;
}

// Build a cone from a ring down to a single tip point (pavilion)
function buildCone(tip, tipY, ring, ringY) {
  const tris = [];
  const n = ring.length;
  for (let i = 0; i < n; i++) {
    const j = (i + 1) % n;
    // Winding: ring is above tip (ringY > tipY), outward normals face out
    tris.push(
      [ring[j][0], ringY, ring[j][1]],
      [ring[i][0], ringY, ring[i][1]],
      [tip[0], tipY, tip[1]]
    );
  }
  return tris;
}

function buildGemGeometry(p) {
  const {
    cut, diameter, depthPct, tablePct, crownHPct,
    crownFacets, pavFacets, girdlePct, culet
  } = p;

  const n = crownFacets;
  const pn = pavFacets;
  const shapeFn = getShapeFn(cut);

  let aspectY = 1;
  if (cut === 'marquise' || cut === 'pear' || cut === 'oval') aspectY = 1.4;

  const R = diameter / 2;
  const totalDepth = diameter * (depthPct / 100);
  const girdleH = Math.max(0.5, diameter * (girdlePct / 100));
  const crownH = (totalDepth - girdleH) * (crownHPct / 100);
  const pavH = Math.max(1, totalDepth - crownH - girdleH);
  const tableR = R * (tablePct / 100);

  // Y axis: 0 = girdle top, positive = up (crown), negative = down (pavilion)
  const yTable     = crownH;
  const yGirdleTop = 0;
  const yGirdleBot = -girdleH;
  const yPavMid    = -girdleH - pavH * 0.6;   // intermediate ring breaks pavilion into two belts
  const yPavTip    = -girdleH - pavH;          // culet tip/flat

  let culetR = 0;
  if (culet === 'small')  culetR = R * 0.03;
  else if (culet === 'medium') culetR = R * 0.07;
  else if (culet === 'large')  culetR = R * 0.13;

  const tris = [];

  const tableRing  = ringPoints(n,     tableR,       tableR * aspectY,     shapeFn);
  const girdleRing = ringPoints(n * 2, R,            R * aspectY,          shapeFn);
  const pavMidRing = ringPoints(pn,    R * 0.35,     R * 0.35 * aspectY,   shapeFn);

  // Table cap
  tris.push(...buildCap(tableRing, yTable, true));

  // Crown: table → girdle
  tris.push(...buildBelt(tableRing, yTable, girdleRing, yGirdleTop));

  // Girdle band
  tris.push(...buildBelt(girdleRing, yGirdleTop, girdleRing, yGirdleBot));

  // Upper pavilion: girdle → mid ring
  tris.push(...buildBelt(girdleRing, yGirdleBot, pavMidRing, yPavMid));

  // Lower pavilion: mid ring → culet tip or flat
  if (culetR > 0) {
    const culetRing = ringPoints(pn, culetR, culetR * aspectY, shapeFn);
    tris.push(...buildBelt(pavMidRing, yPavMid, culetRing, yPavTip));
    tris.push(...buildCap(culetRing, yPavTip, false));
  } else {
    const tipX = cut === 'pear' ? R * 0.05 : 0;
    tris.push(...buildCone([tipX, 0], yPavTip, pavMidRing, yPavMid));
  }

  const flat = tris.flat();
  const pos = new Float32Array(flat.length);
  for (let i = 0; i < flat.length; i++) pos[i] = flat[i];

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.computeVertexNormals();
  return geo;
}

// ─── Collect params from UI ──────────────────────────────────────────────────

function getParams() {
  return {
    cut:        document.getElementById('cut').value,
    diameter:   +document.getElementById('diameter').value,
    depthPct:   +document.getElementById('depth').value,
    tablePct:   +document.getElementById('table').value,
    crownHPct:  +document.getElementById('crownH').value,
    pavDepthPct:+document.getElementById('pavDepth').value,
    crownFacets:+document.getElementById('crownFacets').value,
    pavFacets:  +document.getElementById('pavFacets').value,
    girdlePct:  +document.getElementById('girdle').value,
    culet:      document.getElementById('culet').value,
  };
}

function updateValueLabels(p) {
  document.getElementById('v-diameter').textContent = p.diameter + ' mm';
  document.getElementById('v-depth').textContent = p.depthPct + '%';
  document.getElementById('v-table').textContent = p.tablePct + '%';
  document.getElementById('v-crownH').textContent = p.crownHPct + '%';
  document.getElementById('v-crownFacets').textContent = p.crownFacets;
  document.getElementById('v-pavDepth').textContent = p.pavDepthPct + '%';
  document.getElementById('v-pavFacets').textContent = p.pavFacets;
  document.getElementById('v-girdle').textContent = p.girdlePct + '%';

  const totalDepth = (p.diameter * p.depthPct / 100).toFixed(1);
  const crownH = (p.diameter * p.depthPct / 100 * p.crownHPct / 100).toFixed(1);
  const pavH = (p.diameter * p.depthPct / 100 * (1 - p.crownHPct / 100)).toFixed(1);
  const tableD = (p.diameter * p.tablePct / 100).toFixed(1);
  document.getElementById('dimensions').innerHTML =
    `Diameter: <span>${p.diameter} mm</span><br>` +
    `Total depth: <span>${totalDepth} mm</span><br>` +
    `Table: <span>${tableD} mm (${p.tablePct}%)</span><br>` +
    `Crown height: <span>${crownH} mm</span><br>` +
    `Pavilion depth: <span>${pavH} mm</span>`;
}

// ─── Build / update mesh ─────────────────────────────────────────────────────

function isDark() {
  return document.documentElement.getAttribute('data-theme') === 'dark';
}

function getGemMaterial(wire) {
  if (wire) {
    return new THREE.MeshBasicMaterial({ color: 0x44ffcc, wireframe: true });
  }
  return new THREE.MeshPhysicalMaterial({
    color: isDark() ? 0x4fc3f7 : 0x0984e3,
    metalness: 0.0,
    roughness: 0.05,
    transmission: 0.92,
    thickness: 8,
    ior: 2.4,
    reflectivity: 1.0,
    envMapIntensity: 1.5,
    side: THREE.DoubleSide,
    transparent: true,
  });
}

function rebuildGem() {
  const p = getParams();
  updateValueLabels(p);

  const geo = buildGemGeometry(p);

  if (gemMesh) {
    scene.remove(gemMesh);
    gemMesh.geometry.dispose();
    gemMesh.material.dispose();
  }
  if (wireframeMesh) {
    scene.remove(wireframeMesh);
    wireframeMesh.geometry.dispose();
    wireframeMesh.material.dispose();
    wireframeMesh = null;
  }

  gemMesh = new THREE.Mesh(geo, getGemMaterial(false));
  gemMesh.castShadow = true;
  gemMesh.receiveShadow = true;
  scene.add(gemMesh);

  if (showWireframe) {
    wireframeMesh = new THREE.Mesh(geo, getGemMaterial(true));
    scene.add(wireframeMesh);
  }

  if (firstBuild) {
    firstBuild = false;
    const box = new THREE.Box3().setFromObject(gemMesh);
    const size = box.getSize(new THREE.Vector3());
    const center = box.getCenter(new THREE.Vector3());
    controls.target.copy(center);
    const maxDim = Math.max(size.x, size.y, size.z);
    camera.position.set(center.x, center.y + maxDim * 1.4, center.z + maxDim * 1.8);
    controls.update();
  }
}

// ─── Render loop ─────────────────────────────────────────────────────────────

function resize() {
  const w = container.clientWidth;
  const h = container.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}

new ResizeObserver(resize).observe(container);
resize();
animate();

// ─── UI interactions ─────────────────────────────────────────────────────────

let debounceTimer;
function debouncedRebuild() {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(rebuildGem, 80);
}

document.querySelectorAll('#controls input, #controls select').forEach(el => {
  el.addEventListener('input', debouncedRebuild);
});

document.getElementById('btn-wireframe').addEventListener('click', () => {
  showWireframe = !showWireframe;
  document.getElementById('btn-wireframe').textContent = 'Wireframe: ' + (showWireframe ? 'ON' : 'OFF');
  rebuildGem();
});

document.getElementById('btn-theme').addEventListener('click', () => {
  const isDarkNow = document.documentElement.getAttribute('data-theme') === 'dark';
  document.documentElement.setAttribute('data-theme', isDarkNow ? 'light' : 'dark');
  document.getElementById('btn-theme').textContent = isDarkNow ? 'Dark Mode' : 'Light Mode';
  rebuildGem();
});

document.getElementById('btn-download').addEventListener('click', () => {
  if (!gemMesh) return;
  const result = exporter.parse(gemMesh, { binary: true });
  const blob = new Blob([result], { type: 'application/octet-stream' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  const p = getParams();
  a.download = `gem_${p.cut}_${p.diameter}mm.stl`;
  a.click();
  URL.revokeObjectURL(url);
});

// ─── Init ────────────────────────────────────────────────────────────────────
rebuildGem();
</script>
</body>
</html>
